<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Brand type: Nunito 900 for display, Nunito Sans 300-700 for body/UI.
         These were declared in tailwind.config.ts but never actually loaded,
         so the app had been falling back to system serif / system-ui. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <!-- interactive-widget=resizes-content makes Android Chrome shrink the
         layout viewport when the software keyboard opens, so fixed chrome (the
         nav dock, a chat composer) rides above it instead of hiding behind it.
         iOS ignores this and is handled by useKeyboardInset instead. No
         maximum-scale or user-scalable=no here: pinch-zoom is a WCAG 1.4.4
         requirement, and the iOS focus-zoom it would have suppressed is fixed
         properly by the 16px minimum field size in index.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#EEF6FF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pavilion" />
    <title>Pavilion — Juniper Ridge</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Demo helper: opening the app with ?fresh wipes persisted state before
      // the store hydrates, so a projector machine always starts clean.
      if (location.search.indexOf('fresh') !== -1) {
        try {
          localStorage.removeItem('pavilion-demo');
          localStorage.removeItem('pavilion-demo-data');
        } catch (e) { /* ignore */ }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
